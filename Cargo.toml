[package]
name = "Backtune"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "5"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dependencies.sdl2]
version = "0.38.0"
default-features = false
features = ["ttf", "image"]

[[bin]]
name = "Backtune"
path = "src/main.rs"
